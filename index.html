<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign-up Form</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <!-- logo container -->
    <div class="logo-container">
      <div class="logo">
        <img src="images/odin-lined.png" alt="odin project logo">
        <p>ODIN</p>
      </div>

      <p class="credits">Photo by <a href="https://unsplash.com/@haliewestphoto" target="_blank">Halie West</a> on <a href="https://unsplash.com/" target="_blank">Unsplash</a></p>
    </div>

    <!-- form container -->
     <div class="form-container">
      <header>
        <h2>
          This is not a real online service! You know you need something like this in your life to help you realize your deepest dreams. <br>
          Sign up <i>now</i> to get started.
        </h2>
        <h2>You <i>know</i> you want to.</h2>
      </header>

      <form>
        <h2>Let's do this!</h2>

        <!-- first name and last name -->
        <div class="form-row">
          <!-- first name -->
          <div class="input-container">
            <label for="firstName">FIRST NAME</label>
            <input type="text" id="firstName" name="firstName">
          </div>
          <!-- last name -->
          <div class="input-container">
            <label for="lastName">LAST NAME</label>
            <input type="text" id="lastName" name="lastName">
          </div>
        </div>

        <!-- email and phone number -->
        <div class="form-row">
          <!-- email -->
          <div class="input-container">
            <label for="email">EMAIL</label>
            <input type="email" id="email" name="email">
          </div>
          <!-- phone number -->
          <div class="input-container">
            <label for="phoneNum">PHONE NUMBER</label>
            <input type="tel" id="phoneNum" name="phoneNum">
          </div>
        </div>

        <!-- password and confirm password -->
        <div class="form-row">
          <!-- password -->
          <div class="input-container">
            <label for="password">PASSWORD</label>
            <input type="password" id="password" name="password" required>
          </div>
          <!-- confirm password -->
          <div class="input-container">
            <label for="confirmPass">CONFIRM PASSWORD</label>
            <input type="password" id="confirmPass" name="confirmPass" required>
          </div>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
